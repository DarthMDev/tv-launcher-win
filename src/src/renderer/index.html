<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Toon Valley</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="logo-layers.css">
</head>
<body>
  <div class="window" id="window">

    <!-- The living valley: its sky follows the time of day in Toon Valley
         right now (Pacific time, like the game), with the sun or moon, stars,
         drifting clouds, the season's touches and the trolley's track. -->
    <div class="scene" id="scene" aria-hidden="true">
      <div class="sky"></div>
      <div class="stars"></div>
      <img class="sun" id="sun" src="images/tv/sun.png" alt="" draggable="false">
      <img class="moon" id="moon" src="images/tv/moon.png" alt="" draggable="false">
      <div class="clouds" data-depth="0.4">
        <img class="cloud c1" src="images/tv/cloud.png" alt="" draggable="false">
        <img class="cloud c2" src="images/tv/cloud.png" alt="" draggable="false">
        <img class="cloud c3" src="images/tv/cloud.png" alt="" draggable="false">
        <img class="cloud c4" src="images/tv/cloud.png" alt="" draggable="false">
      </div>
      <div class="season" id="season" data-depth="0.7"></div>
      <svg class="hills far" data-depth="0.25" viewBox="0 0 980 220" preserveAspectRatio="none"><path d="M0 120 C120 60 220 70 330 110 C430 150 520 60 640 70 C760 80 850 130 980 90 L980 220 L0 220 Z"/></svg>
      <svg class="hills near" data-depth="0.5" viewBox="0 0 980 200" preserveAspectRatio="none"><path d="M0 110 C90 70 200 80 300 120 C400 160 470 110 560 100 C680 85 780 140 980 105 L980 200 L0 200 Z"/></svg>
      <div class="ground"></div>
      <canvas class="confetti" id="confetti"></canvas>
    </div>

    <!-- Title bar -->
    <header class="titlebar">
      <div class="logo anim-logo" role="img" aria-label="Toon Valley">
        <img class="anim-logo-base" src="images/logo-base.png" alt="" draggable="false">
        <img class="anim-logo-pie" src="images/logo-pie.png" alt="" draggable="false">
        <img class="anim-logo-gear" src="images/logo-gear.png" alt="" draggable="false">
      </div>
      <div class="clock" id="valley-clock" title="The time in Toon Valley"></div>
      <div class="winbtns">
        <button class="winbtn" id="toggle-sound" title="Sound effects on" aria-label="Sound effects" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
        <button class="winbtn" id="win-min" title="Minimize" aria-label="Minimize">–</button>
        <button class="winbtn close" id="win-close" title="Close" aria-label="Close">✕</button>
      </div>
    </header>

    <!-- News, as a Shticker Book -->
    <section class="book" aria-labelledby="news-title">
      <div class="book-cover">
        <img class="book-icon" src="images/tv/book.png" alt="" draggable="false">
        <h2 id="news-title">Toon Valley News</h2>
      </div>
      <div class="pages" id="news" tabindex="0" aria-live="polite"></div>
      <div class="book-nav">
        <button class="page-btn" id="news-prev" type="button" aria-label="Previous page">◀</button>
        <div class="dots" id="news-dots" role="tablist" aria-label="News pages"></div>
        <button class="page-btn" id="news-next" type="button" aria-label="Next page">▶</button>
      </div>
      <p class="tip" id="toon-tip"></p>
    </section>

    <!-- Log in, or say hi -->
    <section class="card login-card">
      <form id="login-form" novalidate>
        <h2>Log in</h2>
        <input id="username" name="username" placeholder="Username" aria-label="Username" autocomplete="username" spellcheck="false" maxlength="128" required>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" maxlength="256" required>
          <span class="caps" id="caps-warning" hidden>CAPS</span>
          <button class="eye" id="show-password" type="button" title="Show password" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="login-row">
          <label class="check"><input type="checkbox" id="remember"> Remember me</label>
          <button class="link-button small" id="forgot-password" type="button">Forgot password?</button>
        </div>
        <div class="login-row">
          <label class="check" id="remember-password-label"><input type="checkbox" id="remember-password"> Remember password</label>
        </div>
      </form>
      <div class="welcome" id="play-card" hidden>
        <p class="hello">Welcome back,</p>
        <h1 id="player-name"></h1>
        <p id="server-line"></p>
        <p class="session" id="session-line" hidden></p>
        <button class="link-button" id="logout-button" type="button">Log out</button>
      </div>
      <div class="signals" role="status" aria-live="polite">
        <span class="signal" id="status-game" data-state="checking"><i></i><b>Game server</b><em>Checking…</em></span>
        <span class="signal" id="status-api" data-state="checking"><i></i><b>Login server</b><em>Checking…</em></span>
        <button class="refresh" id="refresh-status" type="button" title="Check again (F5)" aria-label="Check server status again">⟳</button>
      </div>
    </section>

    <!-- The big button -->
    <div class="play-zone">
      <button class="playbtn" id="play-button" type="button" data-mode="login">
        <img class="ring" src="images/tv/gear.png" alt="" draggable="false">
        <span class="face"><span class="label">LOG IN</span></span>
      </button>
    </div>

    <!-- Progress: the trolley rides its track -->
    <section class="journey" aria-label="Progress">
      <p class="launcher-update" id="launcher-update" role="status" hidden>
        <span id="launcher-update-text">Launcher updated.</span>
        <button class="btn small green" id="launcher-restart" type="button">Restart</button>
      </p>
      <div class="status-row">
        <p class="state" id="game-state" role="status" aria-live="polite">Checking the servers…</p>
        <button class="btn small" id="patch-action" type="button" hidden></button>
      </div>
      <div class="track" id="progress" data-state="busy" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="rails"><i class="done"></i></div>
        <img class="trolley" id="trolley" src="images/tv/trolley.png" alt="" draggable="false">
        <span class="station start" aria-hidden="true"></span>
        <span class="station end" aria-hidden="true"></span>
      </div>
      <p class="detail" id="progress-detail"></p>
      <p class="message" id="message" role="alert" hidden></p>
    </section>

    <!-- Links -->
    <footer class="footer">
      <nav class="text-links" id="text-links" aria-label="Links"></nav>
      <div class="icons" id="icon-links">
        <button class="icon settings" id="open-settings" type="button" title="Settings (Ctrl+,)" aria-label="Settings">
          <img src="images/tv/gear.png" alt="" draggable="false">
        </button>
      </div>
      <div class="version" id="version"></div>
    </footer>

    <!-- Settings: updates and logs. -->
    <aside class="panel" id="settings" aria-labelledby="settings-title" hidden>
      <div class="panel-inner">
        <h2 class="ribbon" id="settings-title">Settings</h2>

        <section class="setting">
          <h3>Updates</h3>
          <div class="update-row" id="game-files" hidden>
            <div>
              <b>Game</b>
              <p class="field-help" id="game-version"></p>
              <p class="field-help" id="game-checked"></p>
            </div>
            <div class="buttons">
              <button type="button" class="btn small" id="check-game">Check for updates</button>
              <button type="button" class="btn small" id="repair-button">Repair</button>
            </div>
          </div>
          <div class="update-row">
            <div>
              <b>Launcher</b>
              <p class="field-help" id="launcher-help"></p>
            </div>
            <div class="buttons">
              <button type="button" class="btn small" id="check-launcher">Check for update</button>
            </div>
          </div>
        </section>

        <section class="setting">
          <h3>Logs</h3>
          <div class="update-row">
            <p class="field-help" id="logs-help">Reporting a bug? Send the newest game log with it.</p>
            <div class="buttons">
              <button type="button" class="btn small" id="open-logs">Open logs folder</button>
            </div>
          </div>
        </section>

        <div class="panel-actions">
          <span class="keys">Enter: Play · F5: server status · Esc: close</span>
          <span class="spacer"></span>
          <button type="button" class="btn small green" id="close-settings">Done</button>
        </div>
      </div>
    </aside>

    <!-- After the launcher updates itself: what changed. -->
    <aside class="panel" id="whats-new" aria-labelledby="whats-new-title" hidden>
      <div class="panel-inner whats-new-inner">
        <h2 class="ribbon" id="whats-new-title">What's New</h2>
        <p class="whats-new-lead" id="whats-new-lead"></p>
        <div class="whats-new-list" id="whats-new-list"></div>
        <div class="panel-actions">
          <span class="spacer"></span>
          <button type="button" class="btn small green" id="close-whats-new">Got it!</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
